<!DOCTYPE html>
<html>
<head>
	<title>My Personal Webpage</title>
<style>
body{
	background-color: powderblue;
	font-family: Arial;
	color: black;
	text-align: center;
	}
div.header{
	background-color: tomato;
	color:white;
	text-align: center;
	paddington: 20px;
	}
h1{
	color:navy;
	font-size: 36px;
	}
p{
	font-size: 18px;
	}
.grid-container{
	display: grid;
	grid-template-columns: auto auto auto;
	gap: 10px;
	background-color: #f8f8f8;
	padding: 10px;
	}
.grid-item {
	background-color: #4CAF50;
	color: white;
	padding: 20px;
	text-align: center;
	}
.button-transition {
	background-color: navy;
	color: white;
	padding: 10px 20px;
	transition: background-color 1s ease;
	border: none;
	cursor: pointer;
	}
.button-transition:hover {
	background-color: tomato;
	}
img {
	width: 200px;
	height: 125px;
	border-radius: 50%;
	border: 3px solid green;
	margin-top: 10px;
	}
.flex-container {
	display: flex;
	justify-content: space-around;
	background-color: lightgray;
	padding: 20px;
	}
.flex-item {
	background-color: steelblue;
	color: white;
	padding: 20px;
	width: 30%;
	text-align: center;
	}

.table-style2 {
	width: 60%;
	margin: 20px auto;
	border-collapse: collapse;
	border: 2px solid darkgreen;
	}
.table-style2 th, .table-style2 td {
	border: 1px solid darkgreen;
	padding: 10px;
	text-align: center;
	}

.table-style2 th {
	background-color: lightgreen;
	}

.table-style1 {
	width: 80%;
	margin: 20px auto;
	border: 2px solid navy;
	}
.table-style1 th, .table-style1 td {
	border: 1px solid navy;
	padding: 10px;
	text-align: center;
	}

.table-style1 th {
	background-color: lightblue;
	}

div.mycontainer {
	width: 66%;
	overflow:auto;
	}

div.mycontainer div {
	width:50%
	float:left;
	}

.list-style1 {
	list-style-type: square;
	color: darkblue;
	text-align: left;
	margin:20px;
	}

.list-style2 {
	list-style-type: circle;
	color: darkgreen;
	text-align: left;
	margin:20px;
	}
